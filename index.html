<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations | ของขวัญแด่คนเก่ง</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
            overflow-x: hidden;
            transition: background 1s ease;
        }

        /* --- หน้าแรก: พื้นหลังเต็มจอ --- */
        #login-page { 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* [แก้ไข] รูปพื้นหลังหน้าแรก */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                              url('รูป/ทม31.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 380px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        /* --- หน้าเซอร์ไพรส์: พื้นหลังเป็นรูปภาพ --- */
        #surprise-page {
            display: none;
            width: 95%;
            max-width: 900px;
            text-align: center;
            padding: 50px 20px;
            /* [แก้ไข] รูปพื้นหลังหน้าเซอร์ไพรส์ (ใส่สีขาวจางๆ ทับเพื่อให้ข้อความชัด) */
            background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), 
                              url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=1200'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            margin: 40px auto;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- การจัดวางรูปภาพ 10 รูป --- */
        .photo-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .photo-item {
            background: #fff;
            padding: 10px;
            border: 1px solid #eee;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transform: rotate(var(--r));
            transition: 0.4s;
            cursor: zoom-in;
        }

        .photo-item:hover {
            transform: rotate(0deg) scale(1.1);
            z-index: 10;
        }

        .photo-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 2px;
        }

        /* --- ระบบซูมรูป (Lightbox) --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            animation: fadeIn 0.3s ease;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            transform: scale(0.9);
            transition: 0.3s;
        }
        .lightbox.active { display: flex; }
        .lightbox.active img { transform: scale(1); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- ฟอร์มและปุ่ม --- */
        input { 
            padding: 12px 15px; 
            border-radius: 12px; 
            border: 2px solid #ddd; 
            width: 100%; 
            margin-bottom: 12px; 
            font-family: 'Kanit';
            outline: none;
        }
        input:focus { border-color: #ff6b6b; }

        button { 
            padding: 14px 30px; 
            background: #ff6b6b; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer;
            font-family: 'Kanit';
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background: #ee5253; transform: scale(1.02); }

        #music-btn {
            position: fixed; bottom: 20px; right: 20px;
            background: #ff6b6b; color: white; border-radius: 50%;
            width: 50px; height: 50px; display: none;
            justify-content: center; align-items: center; cursor: pointer; z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="บทเพลงแทนหัวใจ Our Fav Song ใจดี.mp3" type="audio/mpeg">
    </audio>

    <div id="login-page">
        <div class="login-card">
            <h2 style="margin-top:0;">ความทรงจำสุดท้าย 🎓</h2>
            <p style="color:#666;">ใส่ชื่อและรหัสผ่านเพื่อรับเซอร์ไพรส์</p>
            <input type="text" id="nameInput" placeholder="ชื่อของคุณ..." autocomplete="off">
            <input type="password" id="passInput" placeholder="รหัสผ่านเข้ากลุ่ม..." autocomplete="off">
            <button onclick="handleLogin()">เปิดดูของขวัญ ✨</button>
            <p id="errorMsg" style="color:#ff4757; font-size:14px; display:none; margin-top:10px;">❌ รหัสผ่านไม่ถูกต้องจ้า</p>
        </div>
    </div>

    <div id="surprise-page">
        <h1 style="color: #2d3436;">ยินดีด้วยนะคุณ <span id="userName" style="color:#ff6b6b;"></span>!</h1>
        <p>"ก้าวเล็กๆ ในวันนั้น สู่ความสำเร็จที่ยิ่งใหญ่ในวันนี้"</p>

       <div class="photo-container">
            <div class="photo-item" style="--r: -3deg;"><img src="รูป/2f5c4733-98b0-441c-aa84-6bb77a920a65.jpg"></div>
            <div class="photo-item" style="--r: 2deg;"><img src="รูป/07b3a00e-134b-411b-b26d-fa81352c49f0.jpg"></div>
            <div class="photo-item" style="--r: -1deg;"><img src="รูป/38e6b218-2684-412d-8c82-f0aae1972beb.jpg"></div>
            <div class="photo-item" style="--r: 4deg;"><img src="รูป/81ed58d9-d7da-4814-a282-16d86a53e8dc.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูป/78216d17-01ab-4d81-a7cd-9adabd5d11e1.jpg"></div>
            <div class="photo-item" style="--r: 3deg;"><img src="รูป/a21d6973-4012-4c9c-a224-0b85937690e9.jpg"></div>
            <div class="photo-item" style="--r: -4deg;"><img src="รูป/cafdde21-17ef-4d29-83c6-ab991b7afdad.jpg"></div>
            <div class="photo-item" style="--r: 1deg;"><img src="รูป/cb4c0988-8dbe-4e88-9f89-21a6dc359479.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูป/cee8219c-f6c8-47e1-a138-13e615ad2a19.jpg"></div>
            <div class="photo-item" style="--r: 5deg;"><img src="รูป/ed5efc40-a46e-4cc6-96ed-7ad140eeb3f9.jpg"></div>
            <div class="photo-item" style="--r: -3deg;"><img src="รูปเซตสอง/2d366ceb-39e2-4054-9c34-b4b309933187.jpg"></div>
            <div class="photo-item" style="--r: 2deg;"><img src="รูปเซตสอง/2f71b09d-bf19-4203-9718-0c4d531509a9.jpg"></div>
            <div class="photo-item" style="--r: -1deg;"><img src="รูปเซตสอง/4b2adbc7-7b5d-4f95-b1c0-246586aa8d1e.jpg"></div>
            <div class="photo-item" style="--r: 4deg;"><img src="รูปเซตสอง/07f5cad9-5693-42d9-97af-a957e98743ce.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูปเซตสอง/86cfa018-67fd-4f88-bf4b-ba6d4b23aab0.jpg"></div>
            <div class="photo-item" style="--r: 3deg;"><img src="รูปเซตสอง/87ce296c-fee9-4692-805d-497fb635a8f6.jpg"></div>
            <div class="photo-item" style="--r: -4deg;"><img src="รูปเซตสอง/a7e03773-a0b6-4cd4-a7aa-e05fa81699cc.jpg"></div>
            <div class="photo-item" style="--r: 1deg;"><img src="รูปเซตสอง/a8ed24e1-c57c-4432-8183-5c689e87d980.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูปเซตสอง/bf978570-6619-4cfd-bc2e-2139a077890e.jpg"></div>
            <div class="photo-item" style="--r: 5deg;"><img src="รูปเซตสอง/fda67013-c02d-4845-8485-7580a98dd57a.jpg"></div>
        </div>

        <h3 style="margin-top: 30px;">ภูมิใจในตัวเธอเสมอ... โชคดีนะเพื่อน! ❤️</h3>
        <button onclick="location.reload()" style="background:#54a0ff; width: auto; padding: 10px 25px;">กลับหน้าแรก</button>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeZoom()"><img id="zoomImg" src=""></div>
    <div id="music-btn" onclick="toggleMusic()">🎵</div>

    <script>
        // --- 1. ตั้งค่ารหัสผ่าน ---
        const SECRET_CODE = "180369"; 

        const music = document.getElementById('bgMusic');

        function handleLogin() {
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const error = document.getElementById('errorMsg');

            if (name !== "" && pass === SECRET_CODE) {
                error.style.display = "none";
                showSurprise(name);
            } else {
                error.style.display = "block";
                document.getElementById('passInput').value = "";
            }
        }

        function showSurprise(name) {
            document.getElementById('userName').innerText = name;
            const loginPage = document.getElementById('login-page');
            loginPage.style.opacity = '0';
            
            setTimeout(() => {
                loginPage.style.display = 'none';
                document.getElementById('surprise-page').style.display = 'block';
                document.getElementById('music-btn').style.display = 'flex';
                
                // เปลี่ยนพื้นหลังของ Body เมื่อเข้าหน้าเซอร์ไพรส์
                document.body.style.backgroundImage = "url('รูป/ทม3.jpg')";
                document.body.style.backgroundSize = "cover";
                document.body.style.backgroundAttachment = "fixed";

                music.play().catch(e => console.log("ต้องการการกดปุ่มเพื่อเล่นเพลง"));

                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 800);
        }

        // ระบบซูมรูป
        document.querySelectorAll('.photo-item img').forEach(image => {
            image.onclick = () => {
                const lightbox = document.getElementById('lightbox');
                const zoomImg = document.getElementById('zoomImg');
                lightbox.classList.add('active');
                zoomImg.src = image.src;
            };
        });

        function closeZoom() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function toggleMusic() {
            if (music.paused) music.play(); else music.pause();
        }
    </script>
</body>
</html>
