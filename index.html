<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations | ของขวัญจากใจ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
        }

        /* --- หน้าล็อกอินพร้อมพื้นหลัง --- */
        #login-page { 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* แก้ไขลิงก์รูปพื้นหลังหน้าแรกตรงนี้ */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                              url('https://images.unsplash.com/photo-1541339907198-e08756defe04?w=1200'); 
            background-size: cover;
            background-position: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 380px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        /* --- หน้าเซอร์ไพรส์ --- */
        #surprise-page {
            display: none;
            width: 95%;
            max-width: 900px;
            text-align: center;
            padding: 40px 20px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin: 40px auto;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- การจัดการรูปภาพ 10 รูป --- */
        .photo-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .photo-item {
            background: #fff;
            padding: 10px;
            border: 1px solid #eee;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transform: rotate(var(--r));
            transition: 0.4s;
        }

        .photo-item:hover {
            transform: rotate(0deg) scale(1.08);
            z-index: 10;
        }

        .photo-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 2px;
        }

        /* --- ฟอร์มและปุ่ม --- */
        input { 
            padding: 12px 15px; 
            border-radius: 12px; 
            border: 2px solid #ddd; 
            width: 100%; 
            margin-bottom: 15px; 
            font-family: 'Kanit';
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #ff6b6b; }

        button { 
            padding: 14px 30px; 
            background: #ff6b6b; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            font-weight: bold;
            font-size: 17px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background: #ee5253; transform: translateY(-2px); }

        .error-text { color: #ff4757; font-size: 14px; display: none; margin-bottom: 10px; }
        
        #music-btn {
            position: fixed; bottom: 20px; right: 20px;
            background: #ff6b6b; color: white; border-radius: 50%;
            width: 50px; height: 50px; display: none;
            justify-content: center; align-items: center; cursor: pointer; z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="บทเพลงแทนหัวใจ Our Fav Song ใจดี.mp3" type="audio/mpeg">
    </audio>

    <div id="login-page">
        <div class="login-card">
            <h2 style="margin-top:0;">ความทรงจำสุดท้าย 🎓</h2>
            <p style="color:#666;">กรุณาระบุตัวตนเพื่อเข้าสู่พื้นที่ของเรา</p>
            
            <input type="text" id="nameInput" placeholder="ชื่อเล่นของคุณ..." autocomplete="off">
            <input type="password" id="passInput" placeholder="รหัสผ่านเข้ากลุ่ม..." autocomplete="off">
            
            <div id="errorMsg" class="error-text">❌ ชื่อหรือรหัสผ่านไม่ถูกต้องจ้า</div>
            
            <button onclick="handleLogin()">เข้าสู่กล่องความทรงจำ ✨</button>
        </div>
    </div>

    <div id="surprise-page">
        <h1 style="color: #2d3436;">Congratulations <span id="userName" style="color:#ff6b6b;"></span>!</h1>
        <p>"ขอบคุณที่ร่วมเดินทางมาด้วยกัน วันนี้เธอเก่งมากจริงๆ"</p>

       <div class="photo-container">
            <div class="photo-item" style="--r: -3deg;"><img src="รูป/2f5c4733-98b0-441c-aa84-6bb77a920a65.jpg"></div>
            <div class="photo-item" style="--r: 2deg;"><img src="รูป/07b3a00e-134b-411b-b26d-fa81352c49f0.jpg"></div>
            <div class="photo-item" style="--r: -1deg;"><img src="รูป/38e6b218-2684-412d-8c82-f0aae1972beb.jpg"></div>
            <div class="photo-item" style="--r: 4deg;"><img src="รูป/81ed58d9-d7da-4814-a282-16d86a53e8dc.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูป/78216d17-01ab-4d81-a7cd-9adabd5d11e1.jpg"></div>
            <div class="photo-item" style="--r: 3deg;"><img src="รูป/a21d6973-4012-4c9c-a224-0b85937690e9.jpg"></div>
            <div class="photo-item" style="--r: -4deg;"><img src="รูป/cafdde21-17ef-4d29-83c6-ab991b7afdad.jpg"></div>
            <div class="photo-item" style="--r: 1deg;"><img src="รูป/cb4c0988-8dbe-4e88-9f89-21a6dc359479.jpg"></div>
            <div class="photo-item" style="--r: -2deg;"><img src="รูป/cee8219c-f6c8-47e1-a138-13e615ad2a19.jpg"></div>
            <div class="photo-item" style="--r: 5deg;"><img src="รูป/ed5efc40-a46e-4cc6-96ed-7ad140eeb3f9.jpg"></div>
        </div>

        <h3 style="margin-top: 30px;">ก้าวต่อไปให้สุดแรงเลยนะเพื่อน! ❤️</h3>
        <button onclick="location.reload()" style="background:#54a0ff; width: auto; padding: 10px 25px;">กลับหน้าแรก</button>
    </div>

    <div id="music-btn" onclick="toggleMusic()">🎵</div>

    <script>
        // --- ตั้งค่ารหัสผ่านที่นี่ ---
        const SECRET_CODE = "180269"; // เปลี่ยนเป็นรหัสผ่านที่คุณต้องการ

        function handleLogin() {
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const error = document.getElementById('errorMsg');

            if (name !== "" && pass === SECRET_CODE) {
                error.style.display = "none";
                showSurprise(name);
            } else {
                error.style.display = "block";
                document.getElementById('passInput').value = "";
            }
        }

        function showSurprise(name) {
            document.getElementById('userName').innerText = name;
            
            // ซ่อนหน้าล็อกอิน
            const loginPage = document.getElementById('login-page');
            loginPage.style.opacity = '0';
            
            setTimeout(() => {
                loginPage.style.display = 'none';
                document.getElementById('surprise-page').style.display = 'block';
                document.getElementById('music-btn').style.display = 'flex';
                
                // เริ่มเล่นเพลง
                const music = document.getElementById('bgMusic');
                music.play().catch(e => console.log("ต้องการการตอบโต้ก่อนเล่นเพลง"));

                // เอฟเฟกต์พลุ
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 800);
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            if (music.paused) music.play(); else music.pause();
        }
    </script>
</body>
</html>
